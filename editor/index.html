<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editor - snippets.run</title>
    <link rel="icon" href="/assets/icon.svg" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="component" href="https://sodium.static.apphor.de/code-editor.html" />
    <link rel="stylesheet" href="https://unpkg.com/@xterm/xterm@6/css/xterm.css" />
    <script type="module">
      import { Terminal } from "https://unpkg.com/@xterm/xterm@6/lib/xterm.mjs";
      import { FitAddon } from "https://unpkg.com/@xterm/addon-fit@0.11.0/lib/addon-fit.mjs";
      import { WebContainer } from "https://unpkg.com/@webcontainer/api@1.1.5/dist/index.js";

      let container;
      let terminal;
      let fitAddon;
      let shellWriter;
      let dirty = false;
      let ownedSnippets = [];
      let currentUser = null;

      function markDirty() {
        dirty = true;
      }

      function allowNavigation(event) {
        if (dirty && !window.confirm("You have unsaved changes. Leave the editor?")) event.preventDefault();
      }

      function createTerminal() {
        terminal = new Terminal({ convertEol: true, cursorBlink: true, theme: { background: "#000000" } });
        fitAddon = new FitAddon();
        terminal.loadAddon(fitAddon);
        terminal.open(document.querySelector("[data-terminal]"));
        fitAddon.fit();
        terminal.onData((data) => shellWriter?.write(data));
        terminal.onResize(({ cols, rows }) => console.debug("terminal resize", cols, rows));
        window.addEventListener("resize", () => fitAddon.fit());
      }

      function updateSnippetOptions(owner) {
        const select = document.querySelector("[data-snippet]");
        select.replaceChildren(...ownedSnippets.filter((item) => item.owner === owner).map((item) => new Option(item.repo, item.repo)));
      }

      function updateOwnedOptions() {
        const namespace = document.querySelector("[data-namespace]");
        const owners = [...new Set(ownedSnippets.map((item) => item.owner))];
        namespace.replaceChildren(...owners.map((owner) => new Option(owner, owner)));
        updateSnippetOptions(owners[0] || "");
      }

      function updateAuthControls() {
        const link = document.querySelector("[data-auth-link]");
        const create = document.querySelector("[data-create-cta]");
        const shell = document.querySelector("[data-editor-shell]");
        const empty = document.querySelector("[data-auth-empty]");
        const navigation = document.querySelector("[data-editor-navigation]");
        const emptySignIn = document.querySelector("[data-empty-signin]");
        if (currentUser) {
          link.textContent = "My Profile";
          link.href = "/mine";
          link.target = "_blank";
          link.rel = "noopener";
          create.hidden = false;
          shell.hidden = false;
          empty.hidden = true;
          navigation.hidden = false;
        } else {
          link.textContent = "Sign In";
          link.href = `https://registry.snippets.run/auth/login?return_to=${encodeURIComponent(location.href)}`;
          emptySignIn.href = link.href;
          link.removeAttribute("target");
          link.removeAttribute("rel");
          create.hidden = true;
          shell.hidden = true;
          empty.hidden = false;
          navigation.hidden = true;
        }
      }

      async function loadUser() {
        const response = await fetch("https://registry.snippets.run/auth/me", { credentials: "include" });
        currentUser = response.ok ? await response.json() : null;
        updateAuthControls();
        if (currentUser) window.dispatchEvent(new Event("editor-auth-ready"));
      }

      async function loadOwnedSnippets() {
        const response = await fetch("https://registry.snippets.run/api/snippets/mine", { credentials: "include" });
        if (response.ok) {
          ownedSnippets = await response.json();
          updateOwnedOptions();
          const params = new URLSearchParams(location.search);
          if (params.get("owner") && params.get("repo")) {
            document.querySelector("[data-namespace]").value = params.get("owner");
            updateSnippetOptions(params.get("owner"));
            document.querySelector("[data-snippet]").value = params.get("repo");
          }
        }
      }

      async function createSnippet(event) {
        event.preventDefault();
        const form = new FormData(event.currentTarget);
        const owner = form.get("owner").toString().trim();
        const name = form.get("name").toString().trim();
        const type = form.get("type").toString();
        const response = await fetch(`https://registry.snippets.run/api/snippets/${encodeURIComponent(owner)}/${encodeURIComponent(name)}.${type}`, {
          method: "POST",
          credentials: "include",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({}),
        });
        if (!response.ok) return;
        document.querySelector("[data-create-dialog]").close();
        const item = { owner, repo: `${name}.${type}`, type: type === "sh" ? "bash" : type === "js" ? "node" : "python" };
        ownedSnippets = [...ownedSnippets.filter((existing) => `${existing.owner}/${existing.repo}` !== `${owner}/${item.repo}`), item];
        updateOwnedOptions();
        document.querySelector("[data-namespace]").value = owner;
        updateSnippetOptions(owner);
        document.querySelector("[data-snippet]").value = item.repo;
        history.replaceState({}, "", `/editor?owner=${encodeURIComponent(owner)}&repo=${encodeURIComponent(item.repo)}`);
      }

      function openQuickNavigation() {
        const dialog = document.querySelector("[data-quick-nav]");
        dialog.showModal();
        dialog.querySelector("input").focus();
        renderQuickNavigation("");
      }

      function renderQuickNavigation(query) {
        const list = document.querySelector("[data-quick-list]");
        const matches = ownedSnippets.filter((item) => `${item.owner}/${item.repo}`.toLowerCase().includes(query.toLowerCase()));
        list.replaceChildren(...matches.map((item) => {
          const button = document.createElement("button");
          button.className = "block w-full rounded px-3 py-2 text-left font-mono text-sm text-slate-300 hover:bg-slate-700";
          button.textContent = `${item.owner}/${item.repo}`;
          button.onclick = () => { document.querySelector("[data-namespace]").value = item.owner; updateSnippetOptions(item.owner); document.querySelector("[data-snippet]").value = item.repo; document.querySelector("[data-quick-nav]").close(); };
          return button;
        }));
      }

      async function startShell() {
        const shell = await container.spawn("sh", [], { env: { npm_config_prefix: "/home/npm", PATH: "/home/npm/bin:/bin:/usr/bin:/usr/local/bin" } });
        shellWriter = shell.input.getWriter();
        shell.output.pipeTo(new WritableStream({ write(data) { terminal.write(data); } }));
      }

      window.getContainer = async () => {
        if (container) return container;
        try {
          container = await WebContainer.boot({ coep: "credentialless", workdirName: "snippets" });
          await container.mount({});
          createTerminal();
          await startShell();
          return container;
        } catch (error) {
          console.error("WebContainer boot failed", error);
          throw error;
        }
      };

      window.addEventListener("DOMContentLoaded", () => {
        document.querySelectorAll("[data-navigate]").forEach((link) => link.addEventListener("click", allowNavigation));
        document.querySelectorAll("[data-editor-input]").forEach((input) => input.addEventListener("input", markDirty));
        window.addEventListener("beforeunload", (event) => { if (dirty) event.preventDefault(); });
        document.querySelector("[data-commit]")?.addEventListener("click", () => { dirty = false; });
        document.querySelector("[data-create-cta]")?.addEventListener("click", () => document.querySelector("[data-create-dialog]").showModal());
        document.querySelector("[data-create-form]")?.addEventListener("submit", createSnippet);
        document.querySelector("[data-namespace]").addEventListener("change", (event) => updateSnippetOptions(event.target.value));
        document.querySelector("[data-quick-input]").addEventListener("input", (event) => renderQuickNavigation(event.target.value));
        window.addEventListener("keydown", (event) => { if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") { event.preventDefault(); openQuickNavigation(); } });
        loadUser();
      });
      window.addEventListener("editor-auth-ready", loadOwnedSnippets);
    </script>
  </head>
  <body class="m-0 flex h-screen min-w-[60rem] flex-col overflow-hidden bg-[#0f172a] font-sans text-slate-300">
    <header class="flex h-14 shrink-0 items-center justify-between border-b border-slate-700 bg-[#151e2e] px-4">
      <div class="flex items-center gap-4">
        <a class="inline-flex items-center gap-2 font-black tracking-[-.04em] text-white no-underline" data-navigate href="/"><img class="size-7 brightness-0 invert" src="/assets/icon.svg" alt="" />snippets.run</a>
        <div class="h-5 w-px bg-slate-700"></div>
        <div data-editor-navigation hidden class="flex items-center gap-2 text-sm"><select data-namespace class="rounded border border-slate-700 bg-slate-800 px-2 py-1.5 text-slate-300 outline-none"><option>Loading...</option></select><span class="text-slate-600">›</span><select data-snippet class="rounded border border-slate-700 bg-slate-800 px-2 py-1.5 text-white outline-none"><option>Loading...</option></select><button class="rounded border border-slate-700 bg-slate-800 px-2 py-1 text-xs text-slate-400 hover:text-white" type="button" onclick="document.querySelector('[data-quick-nav]').showModal()">⌘K</button></div>
      </div>
      <div class="flex items-center gap-2"><button data-create-cta hidden class="rounded bg-blue-600 px-3 py-2 text-xs font-bold text-white hover:bg-blue-500" type="button">＋ New Snippet</button><a data-auth-link class="rounded border border-slate-700 px-3 py-2 text-xs font-bold text-slate-300 no-underline hover:border-slate-500 hover:text-white" href="#">Sign In</a></div>
    </header>

    <section data-auth-empty class="flex min-h-[calc(100vh-3.5rem)] flex-1 items-center justify-center bg-[#0f172a] px-6 py-20 text-center">
      <div class="max-w-md"><img class="mx-auto mb-8 size-24 brightness-0 invert opacity-80" src="/assets/icon.svg" alt="" /><p class="mb-4 font-mono text-xs font-bold tracking-[.18em] text-blue-400 uppercase">Private workspace</p><h1 class="m-0 font-serif text-5xl leading-none tracking-[-.05em] text-white">Sign in before you start building.</h1><p class="mt-6 leading-relaxed text-slate-400">Your snippets, files, and revisions belong to your account.</p><a data-empty-signin class="mt-8 inline-block rounded bg-blue-600 px-5 py-3 font-bold text-white no-underline hover:bg-blue-500" href="#">Sign in to continue</a></div>
    </section>

    <dialog data-quick-nav class="m-auto w-[min(34rem,calc(100vw_-_2rem))] rounded-lg border border-slate-700 bg-[#151e2e] p-2 text-slate-200 shadow-2xl backdrop:bg-black/70"><form method="dialog"><input data-quick-input class="w-full rounded border border-slate-700 bg-[#0f172a] px-3 py-3 font-mono text-sm outline-none focus:border-blue-500" placeholder="Switch to a snippet..." /></form><div data-quick-list class="mt-2 max-h-80 overflow-y-auto"></div></dialog>
    <dialog data-create-dialog class="m-auto w-[min(30rem,calc(100vw_-_2rem))] rounded-lg border border-slate-700 bg-[#151e2e] p-5 text-slate-200 shadow-2xl backdrop:bg-black/70"><form data-create-form><div class="mb-4 flex items-center justify-between"><h2 class="m-0 text-lg font-semibold text-white">New snippet</h2><button class="text-slate-400" type="button" onclick="this.closest('dialog').close()">×</button></div><label class="mb-3 block text-xs font-bold uppercase text-slate-400">Namespace<input class="mt-1 w-full rounded border border-slate-700 bg-[#0f172a] px-3 py-2 text-sm text-white outline-none focus:border-blue-500" name="owner" required /></label><label class="mb-3 block text-xs font-bold uppercase text-slate-400">Snippet name<input class="mt-1 w-full rounded border border-slate-700 bg-[#0f172a] px-3 py-2 text-sm text-white outline-none focus:border-blue-500" name="name" required /></label><label class="block text-xs font-bold uppercase text-slate-400">Runtime<select class="mt-1 w-full rounded border border-slate-700 bg-[#0f172a] px-3 py-2 text-sm text-white outline-none focus:border-blue-500" name="type"><option value="sh">Shell</option><option value="js">Node.js</option><option value="py">Python</option></select></label><button class="mt-5 w-full rounded bg-blue-600 py-2.5 text-sm font-bold text-white hover:bg-blue-500" type="submit">Create and load</button></form></dialog>

    <script type="module">
      const registry = "https://registry.snippets.run";
      const state = { owner: "", repo: "", owned: [], workspace: null, activeFile: "", dirty: false };
      const el = (selector) => document.querySelector(selector);
      const encoded = (value) => encodeURIComponent(value);

      async function api(path, options = {}) {
        const response = await fetch(registry + path, { credentials: "include", headers: { Accept: "application/json", ...options.headers }, ...options });
        const body = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(body.error || `Registry request failed (${response.status})`);
        return body;
      }

      function renderTabs() {
        const tabs = el("[data-file-tabs]");
        const buttons = (state.workspace?.files || []).map((file) => {
          const button = document.createElement("button");
          button.className = `flex h-full items-center gap-2 border-r border-slate-700 px-4 text-sm ${file.path === state.activeFile ? "border-t-2 border-blue-500 bg-[#0f172a] text-slate-200" : "text-slate-400 hover:bg-slate-800"}`;
          button.textContent = `▤ ${file.path}`;
          button.onclick = () => selectFile(file.path);
          return button;
        });
        const add = document.createElement("button");
        add.className = "px-3 text-slate-500 hover:text-white";
        add.textContent = "＋";
        add.onclick = addFile;
        tabs.replaceChildren(...buttons, add);
      }

      async function addFile() {
        const path = window.prompt("New file name");
        if (!path) return;
        await api(`/api/editor/${encoded(state.owner)}/${encoded(state.repo)}/file?path=${encoded(path)}`, { method: "PUT", headers: { "content-type": "text/plain" }, body: "" });
        await loadWorkspace();
      }

      function selectFile(path) {
        const file = state.workspace.files.find((item) => item.path === path);
        if (!file) return;
        state.activeFile = path;
        const editor = el("[data-code-editor]");
        editor.value = file.content;
        editor.setAttribute("language", path.endsWith(".py") ? "python" : path.endsWith(".js") ? "javascript" : "bash");
        renderTabs();
      }

      function renderInputs() {
        const target = el("[data-inputs]");
        target.replaceChildren(...state.workspace.metadata.inputs.map((input, index) => {
          const card = document.createElement("div");
          card.className = "rounded border border-slate-700 bg-slate-800 p-3";
          card.innerHTML = `<div class="grid grid-cols-2 gap-2"><label class="text-[10px] text-slate-400 uppercase">Name<input data-input-name class="mt-1 w-full rounded border border-slate-600 bg-[#0f172a] px-2 py-1 text-xs text-white" value="${input.name}" /></label><label class="text-[10px] text-slate-400 uppercase">Type<select data-input-type class="mt-1 w-full rounded border border-slate-600 bg-[#0f172a] px-2 py-1 text-xs text-white"><option value="string">String</option><option value="number">Number</option><option value="boolean">Boolean</option><option value="file">File Path</option></select></label></div><div class="mt-2 flex items-center justify-between border-t border-slate-700 pt-2 text-xs text-slate-400"><label><input data-input-required type="checkbox" class="mr-1 accent-blue-500" /> Required</label><button data-input-delete class="text-red-400" type="button">Remove</button></div>`;
          card.querySelector("[data-input-type]").value = input.type;
          card.querySelector("[data-input-required]").checked = input.required;
          card.querySelectorAll("input,select").forEach((field) => field.addEventListener("change", () => { updateInput(index, card); saveMetadata(); }));
          card.querySelector("[data-input-delete]").onclick = () => { state.workspace.metadata.inputs.splice(index, 1); renderInputs(); saveMetadata(); };
          return card;
        }));
        const testing = el("[data-test-inputs]");
        testing.replaceChildren(...state.workspace.metadata.inputs.map((input) => {
          const label = document.createElement("label");
          label.className = "block text-[11px]";
          label.innerHTML = `${input.name}${input.required ? ' <span class="text-red-400">*</span>' : ""}<input data-test-value class="mt-1 w-full rounded border border-slate-700 bg-[#0f172a] px-2 py-1.5 text-sm text-white" placeholder="Enter ${input.type}" />`;
          return label;
        }));
      }

      function updateInput(index, card) {
        const input = state.workspace.metadata.inputs[index];
        input.name = card.querySelector("[data-input-name]").value;
        input.type = card.querySelector("[data-input-type]").value;
        input.required = card.querySelector("[data-input-required]").checked;
      }

      async function saveMetadata() {
        state.dirty = true;
        await api(`/api/editor/${encoded(state.owner)}/${encoded(state.repo)}/metadata`, { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(state.workspace.metadata) });
      }

      async function loadWorkspace() {
        const params = new URLSearchParams(location.search);
        const owned = await api("/api/snippets/mine");
        state.owned = owned;
        const owners = [...new Set(owned.map((item) => item.owner))];
        el("[data-namespace]").replaceChildren(...owners.map((owner) => new Option(owner, owner)));
        state.owner = params.get("owner") || owners[0] || "";
        const repos = owned.filter((item) => item.owner === state.owner);
        el("[data-snippet]").replaceChildren(...repos.map((item) => new Option(item.repo, item.repo)));
        state.repo = params.get("repo") || repos[0]?.repo || "";
        if (!state.owner || !state.repo) return;
        el("[data-namespace]").value = state.owner;
        el("[data-snippet]").value = state.repo;
        state.workspace = await api(`/api/editor/${encoded(state.owner)}/${encoded(state.repo)}`);
        el("[data-owner]").value = state.owner;
        el("[data-repo]").value = state.repo;
        el("[data-description]").value = state.workspace.metadata.description;
        renderInputs();
        selectFile(state.workspace.files[0]?.path);
        window.getContainer().catch((error) => console.error(error));
      }

      window.addEventListener("DOMContentLoaded", async () => {
        window.addEventListener("editor-auth-ready", async () => { try { await loadWorkspace(); } catch (error) { console.error(error); } }, { once: true });
        el("[data-description]").addEventListener("change", () => { state.workspace.metadata.description = el("[data-description]").value; saveMetadata(); });
        el("[data-add-input]").addEventListener("click", () => { state.workspace.metadata.inputs.push({ name: "value", type: "string", required: false }); renderInputs(); saveMetadata(); });
        el("[data-code-editor]").addEventListener("change", () => { state.dirty = true; });
        el("[data-namespace]").addEventListener("change", async (event) => { const repos = state.owned.filter((item) => item.owner === event.target.value); el("[data-snippet]").replaceChildren(...repos.map((item) => new Option(item.repo, item.repo))); if (repos[0]) { el("[data-snippet]").value = repos[0].repo; history.replaceState({}, "", `/editor?owner=${encodeURIComponent(event.target.value)}&repo=${encodeURIComponent(repos[0].repo)}`); await loadWorkspace(); } });
        el("[data-snippet]").addEventListener("change", async (event) => { history.replaceState({}, "", `/editor?owner=${encodeURIComponent(el("[data-namespace]").value)}&repo=${encodeURIComponent(event.target.value)}`); await loadWorkspace(); });
        el("[data-revert]").addEventListener("click", () => location.reload());
        el("[data-commit]").addEventListener("click", async () => { await api(`/api/editor/${encoded(state.owner)}/${encoded(state.repo)}/commit`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ message: "Update snippet" }) }); state.dirty = false; await loadWorkspace(); });
      });
    </script>

    <main data-editor-shell hidden class="flex min-h-0 flex-1 overflow-hidden">
      <aside class="flex w-80 shrink-0 flex-col overflow-y-auto border-r border-slate-700 bg-[#151e2e]">
        <div class="space-y-4 border-b border-slate-700 p-4">
            <label class="block text-xs font-medium tracking-wider text-slate-400 uppercase">Owner<input data-owner readonly class="mt-1 w-full rounded border border-slate-700 bg-[#0f172a] px-3 py-2 text-sm text-slate-400 outline-none" /></label>
            <label class="block text-xs font-medium tracking-wider text-slate-400 uppercase">Slug<input data-repo readonly class="mt-1 w-full rounded border border-slate-700 bg-[#0f172a] px-3 py-2 text-sm text-white outline-none" /></label>
            <label class="block text-xs font-medium tracking-wider text-slate-400 uppercase">Description<textarea data-description class="mt-1 h-20 w-full resize-none rounded border border-slate-700 bg-[#0f172a] p-2 text-sm text-slate-300 outline-none"></textarea></label>
        </div>
        <div class="flex-1 p-4">
          <div class="mb-3 flex items-center justify-between"><h2 class="text-sm font-semibold text-white">{ } Input Variables</h2><button data-add-input class="text-xs text-blue-400" type="button">＋ Add Field</button></div>
          <p class="mb-4 text-xs text-slate-500">Define arguments passed to the runner.</p>
          <div data-inputs class="space-y-3"></div>
        </div>
      </aside>

      <section class="flex min-w-0 flex-1 flex-col bg-[#0f172a]">
        <div data-file-tabs class="flex h-10 shrink-0 items-center border-b border-slate-700 bg-[#151e2e] px-2"><button data-add-file class="px-3 text-slate-500 hover:text-white" type="button">＋</button></div>
        <div class="min-h-0 flex-1 overflow-auto bg-[#1e1e1e] p-2"><code-editor data-code-editor nostatus class="block h-full"></code-editor></div>
        <div class="flex shrink-0 justify-end gap-2 border-t border-slate-700 bg-[#151e2e] p-2"><button data-revert class="rounded-md border border-slate-600 bg-slate-800 px-4 py-2 text-slate-300 shadow-lg">↶ Revert</button><button data-commit class="rounded-md bg-blue-600 px-4 py-2 font-medium text-white shadow-lg">▣ Commit</button></div>
      </section>

      <aside class="flex w-96 shrink-0 flex-col border-l border-slate-700 bg-[#151e2e]">
        <div class="flex h-10 shrink-0 items-center justify-between border-b border-slate-700 bg-[#0f172a] px-3 text-xs font-semibold tracking-wider text-slate-400 uppercase"><span>WebContainer Shell</span><span class="text-blue-400">disposable</span></div>
        <div class="flex min-h-0 flex-1 flex-col bg-black"><div class="flex h-8 shrink-0 items-center justify-between border-b border-slate-700 bg-slate-800 px-3 text-xs text-slate-400"><span>⌘ Terminal</span><span>□ ⛶</span></div><div data-terminal class="min-h-0 flex-1 p-2"></div></div>
      </aside>
    </main>
  </body>
</html>
