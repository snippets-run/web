          attr-aria-label="label">

      <script setup>
        import { computed, defineProp, ref } from "@li3/web";

        export default function copyBox() {
          const code = defineProp("code", { default: "" });
          const buttonText = defineProp("label", { default: "Copy" });
          const copied = ref(false);
          const label = computed(() =>
            copied.value ? "Copied" : buttonText.value,
          );

          async function copy() {
            await navigator.clipboard.writeText(code.value);
            copied.value = true;
            setTimeout(() => (copied.value = false), 1800);
          }

          return { code, copy, label };
        }
      </script>

      <script setup>
        import { computed, defineProp, ref } from "@li3/web";

        export default function snippetDetails() {
          const snippet = defineProp("snippet", { default: null });
          const inputValues = ref({});
          const script = computed(() => snippet.value?.script || "");
          const lines = computed(() => script.value.split(/\r?\n/));
          const inputs = computed(
            () =>
              snippet.value?.metadata?.inputs || snippet.value?.inputs || [],
          );
          const history = computed(
            () => snippet.value?.history || snippet.value?.gitHistory || [],
          );
          const description = computed(
            () =>
              snippet.value?.metadata?.description ||
              snippet.value?.description ||
              "A version-controlled script, ready to run.",
          );
          const shortCommit = computed(
            () => snippet.value?.commit?.slice(0, 12) || "—",
          );
          const command = computed(() => {
            if (!snippet.value) return "";
            const target = `run ${snippet.value.owner}/${snippet.value.repo}@${snippet.value.commit}`;
            const args = inputs.value
              .map((input) => {
                const value =
                  inputValues.value[input.name] ?? input.default ?? "";
                return value === ""
                  ? ""
                  : ` --${input.name}='${String(value).replace(/'/g, "'\\''")}'`;
              })
              .filter(Boolean)
              .join("");
            return target + args;
          });

          function inputValue(name) {
            return (
              inputValues.value[name] ??
              inputs.value.find((input) => input.name === name)?.default ??
              ""
            );
          }

          function commitLabel(commit) {
            return commit.shortCommit || commit.commit.slice(0, 7);
          }

          function commitMeta(commit) {
            return `${commitLabel(commit)} · ${commit.date}`;
          }

          function updateInput(name, event) {
            inputValues.value[name] = event.currentTarget.value;
          }

          return {
            command,
            commitLabel,
            commitMeta,
            description,
            history,
            inputValue,
            inputs,
            lines,
            script,
            shortCommit,
            snippet,
            updateInput,
          };
        }
      </script>

                      </div>
                      <input
                        class="border border-[#566057] bg-[#252d26] px-3 py-3 font-mono text-sm text-[#e7ede6] outline-none focus:border-[#d7f34a]"
                        bind-value="newFilePath"
                        placeholder="main.sh"
                        required />
                      <textarea
                        class="min-h-64 flex-1 resize-y border border-[#566057] bg-[#252d26] p-4 font-mono text-sm leading-6 text-[#e7ede6] outline-none focus:border-[#d7f34a]"
                        bind-value="newFileContent"
                        placeholder="Write your snippet..."
                        required
                        spellcheck="false"></textarea>
                      <button
                        class="self-start cursor-pointer rounded-sm border border-[#d7f34a] bg-[#d7f34a] px-4 py-3 text-xs font-black text-[#182019] uppercase disabled:cursor-not-allowed disabled:opacity-40"
                        type="submit"
                        attr-disabled="saving">
                        {{ saving ? 'Staging...' : 'Stage first file' }}
                      </button>
                    </form>
                  </template>
                  <template if="activeFile.path">
                    <div
                      class="flex items-center justify-between border-b border-[#3d473e] bg-[#252d26] px-5 py-3 font-mono text-xs text-[#aab4aa]">
                      <span>{{ activeFile.path }}</span
                      ><span
                        >{{ activeFile.staged ? 'staged' : 'working copy'
                        }}</span
                      >
                    </div>
                    <code-editor
                      class="min-h-0 flex-1"
                      bind-value="editorContent"
                      bind-language="editorLanguage"
                      status="Editing staged source"
                      on-change="markDirty()"></code-editor>
                    <div
                      class="flex items-center justify-between gap-3 border-t border-[#3d473e] bg-[#252d26] px-5 py-3">
                      <span class="font-mono text-xs text-[#aab4aa]"
                        >{{ editorContent.split('\n').length }} lines</span
                      ><button
                        class="cursor-pointer rounded-sm border border-[#d7f34a] bg-[#d7f34a] px-3 py-2 text-xs font-black text-[#182019] uppercase disabled:cursor-not-allowed disabled:opacity-40"
                        type="button"
                        on-click="stageActiveFile()"
                        attr-disabled="!editorDirty || saving">
                        {{ saving ? 'Staging...' : 'Stage file' }}
                      </button>
                    </div>
                  </template>
                </div>
                <aside
                  class="border-l border-[#c8c7bd] bg-[#f7f5ef] max-lg:col-span-2 max-lg:border-t max-lg:border-l-0">
                  <div class="border-b border-[#c8c7bd] px-4 py-4">
                    <b class="text-xs font-black tracking-[.12em] uppercase"
                      >Change history</b
                    >
                  </div>
                  <ol class="m-0 max-h-72 list-none overflow-auto p-0">
                    <template for="entry of editor.history"
                      ><li class="border-b border-[#dedbd2] px-4 py-3">
                        <b
                          class="block overflow-hidden font-mono text-xs text-ellipsis whitespace-nowrap"
                          >{{ entry.message }}</b
                        ><span
                          class="mt-1 block font-mono text-[.65rem] text-[#697069]"
                          >{{ entry.shortCommit }} · {{ entry.date.slice(0, 10)
                          }}</span
                        >
                      </li></template
                    >
                  </ol>
                  <form
                    class="border-t border-[#c8c7bd] p-4"
                    on-submit.prevent="commitChanges($event)">
                    <label
                      class="mb-2 block text-[.65rem] font-black tracking-[.12em] uppercase"
                      for="summary"
                      >Change summary
                      <span class="normal-case text-[#697069]"
                        >optional</span
                      ></label
                    ><textarea
                      class="h-20 w-full resize-none border border-[#c8c7bd] bg-[#fffdf7] p-2.5 text-sm outline-none focus:border-[#182019]"
                      id="summary"
                      bind-value="commitMessage"
                      placeholder="Explain this update"></textarea
                    ><button
                      class="mt-3 w-full cursor-pointer rounded-sm border border-[#182019] bg-[#182019] px-3 py-3 text-xs font-black text-white uppercase disabled:cursor-not-allowed disabled:opacity-40"
                      type="submit"
                      attr-disabled="!hasStagedFiles || committing">
                      {{ committing ? 'Committing...' : 'Commit staged changes'
                      }}
                    </button>
                  </form>
                </aside>
              </div>
            </template>
          </section>
        </template>
      </main>

      <footer
        class-dark-footer="page === 'snippet'"
        class="mx-auto flex min-h-36 w-[calc(100%_-_2.5rem)] max-w-[77.5rem] items-center justify-between border-t border-[#c8c7bd] max-sm:w-[calc(100%_-_1.75rem)]">
        <a
          class="inline-flex items-center gap-2.5 font-black tracking-[-.04em] no-underline"
          href="/"
          ><img class="size-9" src="./assets/icon.svg" alt="" /><span
            >snippets.run</span
          ></a
        >
        <p class="font-serif text-[#697069] italic max-sm:hidden">
          Small scripts. Long memory.
        </p>
        <nav class="flex gap-4">
          <a class="text-xs font-extrabold" href="/search">Registry</a
          ><template if="user"
            ><a class="text-xs font-extrabold" href="/editor"
              >Publish</a
            ></template
          >
        </nav>
      </footer>

      <script setup>
        import { computed, onDestroy, onInit, ref } from "@li3/web";

        const registry = "https://registry.snippets.run";

        export default function app() {
          const page = ref("snippet");
          const user = ref(null);
          const owner = ref("");
          const ownerQuery = ref("");
          const snippets = ref([]);
          const mine = ref([]);
          const snippet = ref(null);
          const editor = ref(null);
          const activeFile = ref({ path: "", content: "", staged: false });
          const editorContent = ref("");
          const newFilePath = ref("");
          const newFileContent = ref("");
          const editorDirty = ref(false);
          const saving = ref(false);
          const committing = ref(false);
          const commitMessage = ref("");
          const createOwner = ref("");
          const createName = ref("");
          const createType = ref("sh");
          const createMessage = ref("");
          const creating = ref(false);
          const createError = ref("");
          const loading = ref(false);
          const error = ref("");
          let requestId = 0;

          const registryTitle = computed(() =>
            owner.value ? `Snippets by ${owner.value}` : "Find runnable code.",
          );
          const resultCount = computed(
            () =>
              `${snippets.value.length} snippet${snippets.value.length === 1 ? "" : "s"}`,
          );
          const runCommand = computed(() =>
            snippet.value
              ? `run ${snippet.value.owner}/${snippet.value.repo}@${snippet.value.commit}`
              : "",
          );
          const shortCommit = computed(
            () => snippet.value?.commit.slice(0, 12) || "",
          );
          const hasStagedFiles = computed(
            () => editor.value?.files.some((file) => file.staged) || false,
          );
          const editorStatus = computed(() =>
            editorDirty.value
              ? "Unstaged edits"
              : hasStagedFiles.value
                ? "Changes staged"
                : "All changes saved",
          );

          const editorLanguage = computed(
            () =>
              ({
                sh: "bash",
                js: "javascript",
                mjs: "javascript",
                py: "python",
                json: "json",
                md: "markdown",
              })[activeFile.value.path.split(".").at(-1)] || "",
          );

          async function request(path) {
            const response = await fetch(registry + path, {
              headers: { Accept: "application/json" },
              credentials: "include",
            });
            if (!response.ok) {
              const body = await response.json().catch(() => ({}));
              throw new Error(
                body.error || `Registry request failed (${response.status})`,
              );
            }
            return response.json();
          }

          async function editorRequest(path, options = {}) {
            const response = await fetch(registry + path, {
              headers: { Accept: "application/json", ...options.headers },
              ...options,
              credentials: "include",
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok)
              throw new Error(
                body.error || `Editor request failed (${response.status})`,
              );
            return body;
          }

          async function createSnippet(event) {
            creating.value = true;
            createError.value = "";
            const form = new FormData(event.currentTarget);
            const owner = form.get("owner")?.toString().trim() || "";
            const name = form.get("name")?.toString().trim() || "";
            const type = form.get("type")?.toString() || "sh";
            const message = form.get("message")?.toString() || "";
            try {
              await editorRequest(
                `/api/snippets/${encodeURIComponent(owner)}/${encodeURIComponent(name)}.${type}`,
                {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ message }),
                },
              );
              newFilePath.value =
                type === "js"
                  ? "index.mjs"
                  : type === "py"
                    ? "main.py"
                    : "main.sh";
              location.hash = `/edit/${encodeURIComponent(owner)}/${encodeURIComponent(name)}.${type}`;
            } catch (reason) {
              createError.value = reason.message;
            } finally {
              creating.value = false;
            }
          }

          function decode(value) {
            try {
              return decodeURIComponent(value);
            } catch {
              return value;
            }
          }

          async function showOwner(selectedOwner) {
            const id = ++requestId;
            owner.value = selectedOwner;
            ownerQuery.value = selectedOwner;
            snippets.value = [];
            error.value = "";
            loading.value = true;
            try {
              const result = await request(
                `/api/snippets/${encodeURIComponent(selectedOwner)}`,
              );
              if (id === requestId) snippets.value = result;
            } catch (reason) {
              if (id === requestId) error.value = reason.message;
            } finally {
              if (id === requestId) loading.value = false;
            }
          }

          async function showMine() {
            loading.value = true;
            mine.value = [];
            error.value = "";
            try {
              mine.value = await request("/api/snippets/mine");
            } catch (reason) {
              error.value = reason.message;
            } finally {
              loading.value = false;
            }
          }

          async function showSnippet(selectedOwner, name) {
            const id = ++requestId;
            owner.value = selectedOwner;
            snippet.value = null;
            error.value = "";
            loading.value = true;
            try {
              const result = await request(
                `/api/snippets/${encodeURIComponent(selectedOwner)}/${encodeURIComponent(name)}`,
              );
              if (id === requestId) snippet.value = result;
            } catch (reason) {
              if (id === requestId) error.value = reason.message;
            } finally {
              if (id === requestId) loading.value = false;
            }
          }

          async function showEditor(selectedOwner, name) {
            const id = ++requestId;
            editor.value = null;
            error.value = "";
            loading.value = true;
            try {
              const result = await editorRequest(
                `/api/editor/${encodeURIComponent(selectedOwner)}/${encodeURIComponent(name)}`,
              );
              if (id !== requestId) return;
              editor.value = result;
              selectFile(
                result.files[0] || { path: "", content: "", staged: false },
              );
            } catch (reason) {
              if (id === requestId) error.value = reason.message;
            } finally {
              if (id === requestId) loading.value = false;
            }
          }

          function selectFile(file) {
            activeFile.value = file;
            editorContent.value = file.content;
            editorDirty.value = false;
          }
          function markDirty() {
            editorDirty.value =
              editorContent.value !== activeFile.value.content;
          }
          function fileClass(file) {
            return file.path === activeFile.value.path
              ? "bg-[#d7f34a] font-bold"
              : "";
          }

          async function stageActiveFile() {
            saving.value = true;
            error.value = "";
            try {
              await editorRequest(
                `/api/editor/${encodeURIComponent(editor.value.owner)}/${encodeURIComponent(editor.value.repo)}/file?path=${encodeURIComponent(activeFile.value.path)}`,
                {
                  method: "PUT",
                  headers: { "Content-Type": "text/plain;charset=UTF-8" },
                  body: editorContent.value,
                },
              );
              activeFile.value.content = editorContent.value;
              activeFile.value.staged = true;
              const file = editor.value.files.find(
                (item) => item.path === activeFile.value.path,
              );
              file.content = editorContent.value;
              file.staged = true;
              editorDirty.value = false;
            } catch (reason) {
              error.value = reason.message;
            } finally {
              saving.value = false;
            }
          }

          async function loadUser() {
            try {
              user.value = await request("/auth/me");
            } catch {
              user.value = null;
            }
          }

          function loginHref() {
            return `${registry}/auth/login?return_to=${encodeURIComponent(location.href)}`;
          }

          async function signOut() {
            await fetch(`${registry}/auth/logout`, {
              method: "POST",
              credentials: "include",
            });
            user.value = null;
          }

          async function stageNewFile() {
            saving.value = true;
            error.value = "";
            try {
              await editorRequest(
                `/api/editor/${encodeURIComponent(editor.value.owner)}/${encodeURIComponent(editor.value.repo)}/file?path=${encodeURIComponent(newFilePath.value.trim())}`,
                {
                  method: "PUT",
                  headers: { "Content-Type": "text/plain;charset=UTF-8" },
                  body: newFileContent.value,
                },
              );
              await showEditor(editor.value.owner, editor.value.repo);
              newFilePath.value = "";
              newFileContent.value = "";
            } catch (reason) {
              error.value = reason.message;
            } finally {
              saving.value = false;
            }
          }
          async function commitChanges() {
            committing.value = true;
            error.value = "";
            try {
              await editorRequest(
                `/api/editor/${encodeURIComponent(editor.value.owner)}/${encodeURIComponent(editor.value.repo)}/commit`,
                {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ message: commitMessage.value }),
                },
              );
              commitMessage.value = "";
              const owner = editor.value.owner;
              const repo = editor.value.repo;
              await showEditor(owner, repo);
            } catch (reason) {
              error.value = reason.message;
            } finally {
              committing.value = false;
            }
          }

          function route() {
            requestId++;
            loading.value = false;
            error.value = "";
            const parts = (location.hash.slice(1) || "/")
              .split("/")
              .filter(Boolean)
              .map(decode);
            if (parts.length === 0) page.value = "snippet";
            else if (parts[0] === "s" && parts.length === 3) {
              page.value = "snippet";
              showSnippet(parts[1], parts[2]);
            } else if (parts[0] === "edit" && parts.length === 3) {
              page.value = "editor";
              showEditor(parts[1], parts[2]);
            } else page.value = "snippet";
            window.scrollTo({ top: 0, behavior: "instant" });
            document.title = `${parts.at(-1) || page.value} - snippets.run`;
          }

          function browseOwner(event) {
            const value = new FormData(event.currentTarget)
              .get("owner")
              ?.toString()
              .trim();
            if (value) location.hash = `/s/${encodeURIComponent(value)}`;
          }

          function snippetHref(item) {
            return `#/s/${encodeURIComponent(item.owner)}/${encodeURIComponent(item.repo)}`;
          }
          function mineHref(item) {
            return `#/edit/${encodeURIComponent(item.owner)}/${encodeURIComponent(item.repo)}`;
          }
          function ownerHref() {
            return `#/s/${encodeURIComponent(owner.value)}`;
          }
          function runtimeLabel(type) {
            return (
              { bash: "SH", node: "JS", python: "PY" }[type] ||
              type.slice(0, 2).toUpperCase()
            );
          }

          onInit(() => {
            window.addEventListener("hashchange", route);
            loadUser();
            route();
          });
          onDestroy(() => window.removeEventListener("hashchange", route));

          return {
            browseOwner,
            activeFile,
            commitChanges,
            commitMessage,
            committing,
            createError,
            createMessage,
            createName,
            createOwner,
            createSnippet,
            createType,
            creating,
            editor,
            editorContent,
            editorDirty,
            editorLanguage,
            editorStatus,
            error,
            fileClass,
            hasStagedFiles,
            loading,
            mine,
            mineHref,
            loginHref,
            markDirty,
            owner,
            ownerHref,
            ownerQuery,
            page,
            registryTitle,
            resultCount,
            runCommand,
            runtimeLabel,
            signOut,
            shortCommit,
            saving,
            newFileContent,
            newFilePath,
            selectFile,
            snippet,
            snippetHref,
            snippets,
            stageActiveFile,
            stageNewFile,
            user,
          };
        }
      </script>
    </template>
  </body>
</html>
