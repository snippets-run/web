      {
        "imports": {
          "@li3/": "https://at-li3.static.apphor.de/",

      import '@li3/web';

  <body class="m-0 min-w-80 bg-[#f3f0e7] font-sans antialiased">
    <template component="copy-box">
      <div
        class="flex w-full min-w-0 items-center justify-between gap-4 rounded-sm border border-[#090d09] bg-[#242c25] py-1.5 pr-1.5 pl-4 text-[#edf2eb]"
      >
        <code class="overflow-auto whitespace-nowrap font-mono text-xs">{{ code }}</code>
        <button
          class="shrink-0 cursor-pointer rounded-xs border-0 bg-[#d7f34a] px-3 py-2 text-[.68rem] font-black text-[#182019] uppercase"
          type="button"
          on-click="copy()"
          attr-aria-label="label"
        >
          <span>{{ label }}</span>
        </button>
      </div>
      <script setup>
        import { computed, defineProp, ref } from '@li3/web';

        export default function copyBox() {
          const code = defineProp('code', { default: '' });
          const copied = ref(false);
          const label = computed(() => (copied.value ? 'Copied' : 'Copy'));

          async function copy() {
            await navigator.clipboard.writeText(code.value);
            copied.value = true;
            setTimeout(() => (copied.value = false), 1800);
          }

          return { code, copy, label };
        }
      </script>
    </template>

      <header

      >

        <nav class="flex items-center gap-1" aria-label="Main navigation">

          >

            >Editor</a
          >
          <a
            class="ml-1 rounded-full border border-[#182019] px-3.5 py-2.5 text-sm font-bold no-underline hover:bg-[#182019] hover:text-white"
            href="#/create"

        </nav>
      </header>

        <template if="page === 'home'">
          <section

          >
            <div>

              <h1

                Write it once.<br /><em

              <p class="my-8 max-w-[38rem] text-[clamp(1.05rem,1.5vw,1.3rem)] leading-relaxed text-[#434b44]">

              <div class="flex flex-wrap gap-3">

            </div>
            <div
              class="rotate-1 overflow-hidden rounded-lg border border-[#070a07] bg-[#1d241e] text-[#e9eee7] shadow-[18px_18px_0_#d7f34a] max-md:mr-3 max-md:shadow-[11px_11px_0_#d7f34a]"

                ><b class="ml-auto font-mono text-[.68rem] font-medium text-[#929c93]">~/anywhere</b>

              </div>

            <div class="grid grid-cols-3 border-t border-[#566057] max-md:grid-cols-1">

                <b class="font-mono text-xs text-[#d7f34a]">03</b>

        <template if="page === 'create'">

                <span class="font-mono text-xs font-extrabold">01</span>
                <div>
                  <h2 class="m-0 mb-2 font-serif text-3xl font-medium">Install the runner</h2>
                  <p class="mt-0 mb-5 text-[#697069]">Install the native runner to publish from your terminal.</p>
                  <copy-box class="block max-w-xl" code="curl -fsSL https://install.snippets.run | sh"></copy-box>

                <span class="font-mono text-xs font-extrabold">02</span>
                <div>

                </div>
              </article>
              <article
                class="grid grid-cols-[6.25rem_1fr] gap-8 border-b border-[#c8c7bd] py-10 max-md:grid-cols-[3rem_1fr] max-md:gap-2"
              >
                <span class="font-mono text-xs font-extrabold">03</span>
                <div>
                  <h2 class="m-0 mb-2 font-serif text-3xl font-medium">Run it everywhere</h2>
                  <p class="mt-0 mb-5 text-[#697069]">
                    Your immutable snippet can now be called by owner and repository name.
                  </p>
                  <copy-box class="block max-w-xl" code="run your-name/tool.sh"></copy-box>
                </div>
              </article>
            </div>
          </section>
        </template>

        <template if="page === 'explore'">
          <section
            class="mx-auto w-[calc(100%_-_2.5rem)] max-w-[59rem] py-24 max-md:w-[calc(100%_-_1.75rem)] max-md:py-20"
          >
            <div>
              <p class="mb-5 text-xs font-black tracking-[.15em] uppercase">Registry browser</p>
              <h1
                class="m-0 max-w-4xl font-serif text-[clamp(3.3rem,7vw,6.3rem)] leading-[.88] font-medium tracking-[-.065em]"
              >
                {{ registryTitle }}
              </h1>
              <p class="mt-6 text-lg text-[#697069]">
                Look up an owner to inspect their public, runnable repositories.
              </p>
              <form
                class="my-14 border border-[#182019] bg-[#fffdf7] p-5 shadow-[7px_7px_0_#182019] max-md:p-4 max-md:shadow-[5px_5px_0_#182019]"
                on-submit.prevent="browseOwner($event)"
              >
                <label class="mb-2.5 block text-xs font-black tracking-[.1em] uppercase" for="owner"
                  >Repository owner</label
                >
                <div class="flex">
                  <input
                    class="min-w-0 flex-1 border border-[#c8c7bd] bg-transparent px-3.5 py-3 outline-none focus:border-[#182019] focus:ring-1 focus:ring-[#182019]"

                    name="owner"
                    bind-value="ownerQuery"
                    placeholder='Try "snippets"'
                    required
                  /><button
                    class="cursor-pointer border border-[#182019] bg-[#182019] px-6 font-extrabold text-white"
                    type="submit"
                  >
                    Browse
                  </button>
                </div>
              </form>
            </div>

            <template if="loading"
              ><div class="flex items-center gap-3.5 border border-[#c8c7bd] bg-[#fffdf7] p-5">
                <span class="size-5 animate-spin rounded-full border-2 border-[#c8c7bd] border-t-[#182019]"></span>
                <p class="m-0 text-[#697069]">Reading the registry...</p>
              </div></template
            >
            <template if="error"
              ><div class="border border-[#ff7146] bg-[#fffdf7] p-5">
                <b>Request failed</b>
                <p class="mt-2 mb-0 text-[#697069]">{{ error }}</p>
              </div></template
            >
            <template if="!loading && !error && owner && snippets.length === 0"
              ><div class="border border-[#c8c7bd] bg-[#fffdf7] p-5">
                <b>No snippets yet</b>

              </div></template
            >
            <template if="!loading && snippets.length > 0">
              <div

                <span>{{ resultCount }}</span><span>Runtime</span>
              </div>
              <ul class="m-0 list-none border-t border-[#182019] p-0">
                <template for="item of snippets">
                  <li class="border-b border-[#c8c7bd]">

                      class="grid grid-cols-[3rem_1fr_6.25rem_1.5rem] items-center gap-4 px-4 py-5 no-underline transition-all hover:bg-[#fffdf7] hover:px-5 max-md:grid-cols-[2.75rem_1fr_1.5rem] max-md:gap-3 max-md:px-1"

                      <span class="text-xs font-bold uppercase max-md:hidden">{{ item.type }}</span

        <template if="page === 'snippet'">

            class="mx-auto w-[calc(100%_-_2.5rem)] max-w-[68.75rem] py-24 max-md:w-[calc(100%_-_1.75rem)] max-md:py-20"

            <template if="loading"
              ><div class="flex items-center gap-3.5 border border-[#c8c7bd] bg-[#fffdf7] p-5">
                <span class="size-5 animate-spin rounded-full border-2 border-[#c8c7bd] border-t-[#182019]"></span>

            >
            <template if="error"

            <template if="!loading && snippet">

              <div class="flex flex-col gap-9">
                <div>
                  <p class="mb-5 text-xs font-black tracking-[.15em] uppercase">{{ snippet.type }} snippet</p>
                  <h1

                  <dd class="m-0 overflow-hidden font-mono text-sm font-semibold text-ellipsis whitespace-nowrap">
                    {{ snippet.type }}
                  </dd>
                </div>
                <div class="min-w-0 border-l border-[#c8c7bd] p-5 max-md:border-t max-md:border-l-0">
                  <dt class="mb-2 text-[.65rem] font-black tracking-[.12em] text-[#697069] uppercase">Entrypoint</dt>
                  <dd class="m-0 overflow-hidden font-mono text-sm font-semibold text-ellipsis whitespace-nowrap">
                    {{ snippet.entrypoint }}
                  </dd>
                </div>

                  <dt class="mb-2 text-[.65rem] font-black tracking-[.12em] text-[#697069] uppercase">Commit</dt>
                  <dd class="m-0 overflow-hidden font-mono text-sm font-semibold text-ellipsis whitespace-nowrap">

                  <span>{{ snippet.entrypoint }}</span><span>read only</span>

        <template if="page === 'editor'">
          <section class="mx-auto w-[calc(100%_-_2.5rem)] max-w-[90rem] py-10 max-md:w-[calc(100%_-_1.75rem)]">
            <template if="loading"
              ><div class="flex items-center gap-3 border border-[#c8c7bd] bg-[#fffdf7] p-5">

                    <b class="text-xs font-black tracking-[.12em] uppercase">Files</b>
                  </div>
                  <nav class="p-2" aria-label="Snippet files">
                    <template for="file of editor.files"
                      ><button
                        class="flex w-full cursor-pointer items-center justify-between gap-2 rounded-sm px-3 py-2.5 text-left font-mono text-xs hover:bg-[#e7e5dd]"
                        bind-class="fileClass(file)"
                        type="button"
                        on-click="selectFile(file)"
                      >
                        <span class="overflow-hidden text-ellipsis whitespace-nowrap">{{ file.path }}</span
                        ><span
                          class="size-1.5 shrink-0 rounded-full bg-[#ff7146]"
                          attr-hidden="!file.staged"
                        ></span></button
                    ></template>
                  </nav>
                </aside>
                <div class="flex min-w-0 flex-col bg-[#1a211b] text-[#e7ede6]">
                  <div
                    class="flex items-center justify-between border-b border-[#3d473e] bg-[#252d26] px-5 py-3 font-mono text-xs text-[#aab4aa]"
                  >
                    <span>{{ activeFile.path }}</span><span>{{ activeFile.staged ? 'staged' : 'working copy' }}</span>
                  </div>
                  <code-editor
                    class="min-h-0 flex-1"
                    bind-value="editorContent"
                    bind-language="editorLanguage"
                    status="Editing staged source"
                    on-change="markDirty()"
                  ></code-editor>
                  <div class="flex items-center justify-between gap-3 border-t border-[#3d473e] bg-[#252d26] px-5 py-3">
                    <span class="font-mono text-xs text-[#aab4aa]">{{ editorContent.split('\n').length }} lines</span
                    ><button
                      class="cursor-pointer rounded-sm border border-[#d7f34a] bg-[#d7f34a] px-3 py-2 text-xs font-black text-[#182019] uppercase disabled:cursor-not-allowed disabled:opacity-40"
                      type="button"
                      on-click="stageActiveFile()"
                      attr-disabled="!editorDirty || saving"
                    >
                      {{ saving ? 'Staging...' : 'Stage file' }}
                    </button>
                  </div>
                </div>
                <aside
                  class="border-l border-[#c8c7bd] bg-[#f7f5ef] max-lg:col-span-2 max-lg:border-t max-lg:border-l-0"
                >
                  <div class="border-b border-[#c8c7bd] px-4 py-4">
                    <b class="text-xs font-black tracking-[.12em] uppercase">Change history</b>
                  </div>
                  <ol class="m-0 max-h-72 list-none overflow-auto p-0">
                    <template for="entry of editor.history"
                      ><li class="border-b border-[#dedbd2] px-4 py-3">
                        <b class="block overflow-hidden font-mono text-xs text-ellipsis whitespace-nowrap"
                          >{{ entry.message }}</b
                        ><span class="mt-1 block font-mono text-[.65rem] text-[#697069]"
                          >{{ entry.shortCommit }} · {{ entry.date.slice(0, 10) }}</span
                        >
                      </li></template
                    >
                  </ol>
                  <form class="border-t border-[#c8c7bd] p-4" on-submit.prevent="commitChanges($event)">
                    <label class="mb-2 block text-[.65rem] font-black tracking-[.12em] uppercase" for="summary"
                      >Change summary <span class="normal-case text-[#697069]">optional</span></label
                    ><textarea
                      class="h-20 w-full resize-none border border-[#c8c7bd] bg-[#fffdf7] p-2.5 text-sm outline-none focus:border-[#182019]"
                      id="summary"
                      bind-value="commitMessage"
                      placeholder="Explain this update"
                    ></textarea
                    ><button
                      class="mt-3 w-full cursor-pointer rounded-sm border border-[#182019] bg-[#182019] px-3 py-3 text-xs font-black text-white uppercase disabled:cursor-not-allowed disabled:opacity-40"
                      type="submit"
                      attr-disabled="!hasStagedFiles || committing"
                    >
                      {{ committing ? 'Committing...' : 'Commit staged changes' }}
                    </button>
                  </form>
                </aside>
              </div>
            </template>
          </section>
        </template>

        <template if="page === 'not-found'">
          <section class="mx-auto w-[calc(100%_-_2.5rem)] max-w-[56rem] py-36 text-center">
            <p class="mb-5 text-xs font-black tracking-[.15em] uppercase">404</p>
            <h1 class="mb-12 font-serif text-[clamp(3.3rem,7vw,6.3rem)] leading-[.88] font-medium tracking-[-.065em]">
              That command went nowhere.
            </h1>
            <a
              class="rounded-sm border border-[#182019] bg-[#182019] px-5 py-3.5 font-extrabold text-white no-underline"
              href="#/"
              >Return home</a
            >
          </section>
        </template>
      </main>

      <footer
        class="mx-auto flex min-h-36 w-[calc(100%_-_2.5rem)] max-w-[77.5rem] items-center justify-between border-t border-[#c8c7bd] max-sm:w-[calc(100%_-_1.75rem)]"
      >
        <a class="inline-flex items-center gap-2.5 font-black tracking-[-.04em] no-underline" href="#/"
          ><img class="size-9" src="./assets/icon.svg" alt="" /><span>snippets.run</span></a
        >
        <p class="font-serif text-[#697069] italic max-sm:hidden">Small scripts. Long memory.</p>
        <nav class="flex gap-4">
          <a class="text-xs font-extrabold" href="#/explore">Registry</a
          ><a class="text-xs font-extrabold" href="#/create">Publish</a>
        </nav>
      </footer>

      <script setup>
        import { computed, onDestroy, onInit, ref } from '@li3/web';

        const registry = 'https://registry.snippets.run';

        export default function app() {
          const page = ref('home');
          const owner = ref('');
          const ownerQuery = ref('');
          const snippets = ref([]);
          const snippet = ref(null);
          const editor = ref(null);
          const activeFile = ref({ path: '', content: '', staged: false });
          const editorContent = ref('');
          const editorDirty = ref(false);
          const saving = ref(false);
          const committing = ref(false);
          const commitMessage = ref('');
          const loading = ref(false);
          const error = ref('');
          let requestId = 0;

          const registryTitle = computed(() => (owner.value ? `Snippets by ${owner.value}` : 'Find runnable code.'));
          const resultCount = computed(
            () => `${snippets.value.length} snippet${snippets.value.length === 1 ? '' : 's'}`,
          );
          const runCommand = computed(() =>
            snippet.value ? `run ${snippet.value.owner}/${snippet.value.repo}@${snippet.value.commit}` : '',
          );
          const shortCommit = computed(() => snippet.value?.commit.slice(0, 12) || '');
          const hasStagedFiles = computed(() => editor.value?.files.some((file) => file.staged) || false);
          const editorStatus = computed(() =>
            editorDirty.value ? 'Unstaged edits' : hasStagedFiles.value ? 'Changes staged' : 'All changes saved',
          );
          const editorStatusClass = computed(() =>
            editorDirty.value ? 'bg-[#fffdf7]' : hasStagedFiles.value ? 'bg-[#d7f34a]' : 'bg-[#e7e5dd]',
          );
          const editorLanguage = computed(
            () =>
              ({ sh: 'bash', js: 'javascript', mjs: 'javascript', py: 'python', json: 'json', md: 'markdown' })[
                activeFile.value.path.split('.').at(-1)
              ] || '',
          );

          async function request(path) {
            const response = await fetch(registry + path, {
              headers: { Accept: 'application/json' },
            });
            if (!response.ok) {
              const body = await response.json().catch(() => ({}));
              throw new Error(body.error || `Registry request failed (${response.status})`);
            }
            return response.json();
          }

          async function editorRequest(path, options = {}) {
            const response = await fetch(registry + path, {
              headers: { Accept: 'application/json', ...options.headers },
              ...options,
            });
            const body = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(body.error || `Editor request failed (${response.status})`);
            return body;
          }

          function decode(value) {
            try {
              return decodeURIComponent(value);
            } catch {
              return value;
            }
          }

          async function showOwner(selectedOwner) {
            const id = ++requestId;
            owner.value = selectedOwner;
            ownerQuery.value = selectedOwner;
            snippets.value = [];
            error.value = '';
            loading.value = true;
            try {
              const result = await request(`/api/snippets/${encodeURIComponent(selectedOwner)}`);
              if (id === requestId) snippets.value = result;
            } catch (reason) {
              if (id === requestId) error.value = reason.message;
            } finally {
              if (id === requestId) loading.value = false;
            }
          }

          async function showSnippet(selectedOwner, name) {
            const id = ++requestId;
            owner.value = selectedOwner;
            snippet.value = null;
            error.value = '';
            loading.value = true;
            try {
              const result = await request(
                `/api/snippets/${encodeURIComponent(selectedOwner)}/${encodeURIComponent(name)}`,
              );
              if (id === requestId) snippet.value = result;
            } catch (reason) {
              if (id === requestId) error.value = reason.message;
            } finally {
              if (id === requestId) loading.value = false;
            }
          }

          async function showEditor(selectedOwner, name) {
            const id = ++requestId;
            editor.value = null;
            error.value = '';
            loading.value = true;
            try {
              const result = await editorRequest(
                `/api/editor/${encodeURIComponent(selectedOwner)}/${encodeURIComponent(name)}`,
              );
              if (id !== requestId) return;
              editor.value = result;
              selectFile(result.files[0]);
            } catch (reason) {
              if (id === requestId) error.value = reason.message;
            } finally {
              if (id === requestId) loading.value = false;
            }
          }

          function selectFile(file) {
            activeFile.value = file;
            editorContent.value = file.content;
            editorDirty.value = false;
          }
          function markDirty() {
            editorDirty.value = editorContent.value !== activeFile.value.content;
          }
          function fileClass(file) {
            return file.path === activeFile.value.path ? 'bg-[#d7f34a] font-bold' : '';
          }

          async function stageActiveFile() {
            saving.value = true;
            error.value = '';
            try {
              await editorRequest(
                `/api/editor/${encodeURIComponent(editor.value.owner)}/${encodeURIComponent(editor.value.repo)}/file?path=${encodeURIComponent(activeFile.value.path)}`,
                {
                  method: 'PUT',
                  headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                  body: editorContent.value,
                },
              );
              activeFile.value.content = editorContent.value;
              activeFile.value.staged = true;
              const file = editor.value.files.find((item) => item.path === activeFile.value.path);
              file.content = editorContent.value;
              file.staged = true;
              editorDirty.value = false;
            } catch (reason) {
              error.value = reason.message;
            } finally {
              saving.value = false;
            }
          }

          async function commitChanges() {
            committing.value = true;
            error.value = '';
            try {
              await editorRequest(
                `/api/editor/${encodeURIComponent(editor.value.owner)}/${encodeURIComponent(editor.value.repo)}/commit`,
                {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ message: commitMessage.value }),
                },
              );
              commitMessage.value = '';
              const owner = editor.value.owner;
              const repo = editor.value.repo;
              await showEditor(owner, repo);
            } catch (reason) {
              error.value = reason.message;
            } finally {
              committing.value = false;
            }
          }

          function route() {
            requestId++;
            loading.value = false;
            error.value = '';
            const parts = (location.hash.slice(1) || '/').split('/').filter(Boolean).map(decode);
            if (parts.length === 0) page.value = 'home';
            else if (parts[0] === 'create' && parts.length === 1) page.value = 'create';
            else if (parts[0] === 'explore' && parts.length === 1) {
              page.value = 'explore';
              owner.value = '';
              ownerQuery.value = '';
              snippets.value = [];
            } else if (parts[0] === 's' && parts.length === 2) {
              page.value = 'explore';
              showOwner(parts[1]);
            } else if (parts[0] === 's' && parts.length === 3) {
              page.value = 'snippet';
              showSnippet(parts[1], parts[2]);
            } else if (parts[0] === 'edit' && parts.length === 3) {
              page.value = 'editor';
              showEditor(parts[1], parts[2]);
            } else page.value = 'not-found';
            window.scrollTo({ top: 0, behavior: 'instant' });
            document.title = page.value === 'home' ? 'snippets.run' : `${parts.at(-1) || page.value} - snippets.run`;
          }

          function browseOwner(event) {
            const value = new FormData(event.currentTarget).get('owner')?.toString().trim();
            if (value) location.hash = `/s/${encodeURIComponent(value)}`;
          }

          function snippetHref(item) {
            return `#/s/${encodeURIComponent(item.owner)}/${encodeURIComponent(item.repo)}`;
          }
          function ownerHref() {
            return `#/s/${encodeURIComponent(owner.value)}`;
          }
          function runtimeLabel(type) {
            return { bash: 'SH', node: 'JS', python: 'PY' }[type] || type.slice(0, 2).toUpperCase();
          }

          onInit(() => {
            window.addEventListener('hashchange', route);
            route();
          });
          onDestroy(() => window.removeEventListener('hashchange', route));

          return {
            browseOwner,
            activeFile,
            commitChanges,
            commitMessage,
            committing,
            editor,
            editorContent,
            editorDirty,
            editorLanguage,
            editorStatus,
            editorStatusClass,
            error,
            fileClass,
            hasStagedFiles,
            loading,
            markDirty,
            owner,
            ownerHref,
            ownerQuery,
            page,
            registryTitle,
            resultCount,
            runCommand,
            runtimeLabel,
            shortCommit,
            saving,
            selectFile,
            snippet,
            snippetHref,
            snippets,
            stageActiveFile,
          };
        }
      </script>
    </template>
  </body>
</html>
