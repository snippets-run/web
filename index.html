<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A fast, read-only view of a runnable snippet." />
    <title>Snippet · snippets.run</title>
    <link rel="icon" href="/assets/icon.svg" />
    <link rel="component" href="https://sodium.static.apphor.de/code-block.html" />
    <script type="importmap">
      { "imports": { "@li3/": "https://at-li3.static.apphor.de/" } }
    </script>
    <script type="module">
      import "@li3/web";
    </script>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #0d1420;
        color: #e2e8f0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-width: 20rem;
        min-height: 100vh;
        margin: 0;
      }
      .topbar {
        display: flex;
        min-height: 4.5rem;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem max(1rem, calc((100vw - 76rem) / 2));
        border-bottom: 1px solid #233246;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        color: #e2e8f0;
        font:
          700 0.8rem ui-monospace,
          monospace;
        letter-spacing: 0.12em;
        text-decoration: none;
        text-transform: uppercase;
      }
      .brand img {
        width: 2rem;
        height: 2rem;
        filter: brightness(0) invert(1);
      }
      .account {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        min-width: 0;
      }
      .profile {
        display: flex;
        align-items: center;
        gap: 0.65rem;
        min-width: 0;
        padding: 0.4rem 0.7rem;
        border: 1px solid #233246;
        border-radius: 0.55rem;
        background: #151e2e;
      }
      .avatar {
        display: grid;
        width: 2rem;
        height: 2rem;
        flex: 0 0 auto;
        place-items: center;
        overflow: hidden;
        border-radius: 50%;
        background: #24465b;
        color: #c3f3ff;
        font-size: 0.75rem;
        font-weight: 700;
      }
      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .identity {
        min-width: 0;
      }
      .identity strong,
      .identity small {
        display: block;
        overflow: hidden;
        max-width: 14rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .identity strong {
        color: #e2e8f0;
        font-size: 0.75rem;
      }
      .identity small {
        margin-top: 0.15rem;
        color: #94a3b8;
        font-size: 0.68rem;
      }
      .auth-link {
        padding: 0.62rem 0.9rem;
        border: 1px solid #8bd6e9;
        border-radius: 0.4rem;
        background: #a6e6f4;
        color: #092030;
        font-size: 0.75rem;
        font-weight: 700;
        text-decoration: none;
      }
      .editor-link {
        color: #a6e6f4;
        font-size: 0.75rem;
        font-weight: 700;
        text-decoration: none;
      }
      main {
        width: min(76rem, calc(100% - 2rem));
        margin: 2rem auto 4rem;
      }
      .breadcrumbs {
        margin: 0 0 0.8rem;
        color: #94a3b8;
        font:
          0.75rem ui-monospace,
          monospace;
      }
      .breadcrumbs span {
        color: #a6e6f4;
      }
      h1 {
        margin: 0;
        color: #fff;
        font-size: clamp(1.6rem, 4vw, 2.3rem);
        line-height: 1.1;
        overflow-wrap: anywhere;
      }
      .summary {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.2rem;
        margin: 0.85rem 0 1.25rem;
        color: #94a3b8;
        font:
          0.72rem ui-monospace,
          monospace;
      }
      code-block {
        display: block;
        overflow: auto;
        max-height: calc(100vh - 14rem);
        min-height: 10rem;
        border: 1px solid #233246;
        border-radius: 0.6rem;
      }
      .message {
        padding: 1rem;
        border: 1px solid #233246;
        border-radius: 0.5rem;
        color: #94a3b8;
      }
      .snippet-list {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 18rem), 1fr));
        gap: 0.75rem;
        margin: 1.5rem 0 0;
        padding: 0;
        list-style: none;
      }
      .snippet-list a {
        display: block;
        padding: 1rem;
        border: 1px solid #233246;
        border-radius: 0.6rem;
        background: #101927;
        color: #e2e8f0;
        text-decoration: none;
      }
      .snippet-list a:hover,
      .snippet-list a:focus-visible {
        border-color: #8bd6e9;
      }
      .snippet-list strong,
      .snippet-list small {
        display: block;
        overflow-wrap: anywhere;
      }
      .snippet-list small {
        margin-top: 0.45rem;
        color: #94a3b8;
        font:
          0.72rem ui-monospace,
          monospace;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 36rem) {
        .identity small {
          display: none;
        }
        .identity strong {
          max-width: 8rem;
        }
        main {
          margin-top: 1.5rem;
        }
        code-block {
          max-height: none;
        }
      }
    </style>
  </head>
  <body>
    <script state type="application/json" id="snippet-state">
      __SNIPPET_STATE__
    </script>
    <template app>
      <header class="topbar">
        <a class="brand" href="/" aria-label="snippets.run"><img src="/assets/icon.svg" alt="" />snippets.run</a>
        <div class="account">
          <a class="editor-link" href="/editor">Publish</a>
          <template if="user">
            <div class="profile" aria-label="Signed-in user">
              <span class="avatar">
                <template if="userPicture"><img bind-src="userPicture" alt="" /></template>
                <template if="!userPicture">{{ userInitials }}</template>
              </span>
              <span class="identity"><strong>{{ userName }}</strong><small>{{ userEmail }}</small></span>
            </div>
          </template>
          <template if="!user && !authLoading"><a class="auth-link" bind-href="loginHref">Sign in</a></template>
        </div>
      </header>
      <main>
        <template if="listing">
          <h1>Snippets</h1>
          <template if="snippets.length">
            <ul class="snippet-list">
              <template for="snippet of snippets"
                ><li>
                  <a bind-href="snippet.href">
                    <strong>{{ snippet.repo }}</strong>
                    <small>{{ snippet.owner }} / {{ snippet.type }}</small>
                  </a>
                </li></template
              >
            </ul>
          </template>
          <template if="!snippets.length"><p class="message">No snippets found.</p></template>
        </template>
        <template if="snippet">
          <p class="breadcrumbs"><span>{{ snippet.owner }}</span> / {{ snippet.repo }}</p>
          <h1>{{ snippet.repo }}</h1>
          <p class="summary">
            <span>{{ snippet.type }}</span>
            <span>{{ snippet.entrypoint }}</span>
            <span>{{ shortCommit }}</span>
          </p>
          <code-block bind-source="snippet.script" bind-language="snippetLanguage" theme="a11y-dark"></code-block>
        </template>
        <template if="error"><p class="message" role="alert">{{ error }}</p></template>
      </main>
      <script setup>
        import { computed, onInit, ref } from "@li3/web";

        const registry = "https://registry.snippets.run";

        export default function snippetPage() {
          const stateElement = document.getElementById("snippet-state");
          const state = JSON.parse(stateElement?.textContent || "null");
          const snippet = ref(state && !state.listing ? state : null);
          const listing = ref(Boolean(state?.listing));
          const snippets = ref(
            (state?.snippets || []).map((item) => ({
              ...item,
              href: `/s/${encodeURIComponent(item.owner)}/${encodeURIComponent(item.repo)}`,
            })),
          );
          const user = ref(null);
          const authLoading = ref(true);
          const error = ref("");
          const userName = computed(
            () => user.value?.name || user.value?.preferred_username || user.value?.email || "Account",
          );
          const userEmail = computed(() => user.value?.email || "Signed in");
          const userPicture = computed(() => user.value?.picture || user.value?.avatar || "");
          const userInitials = computed(() => userName.value.slice(0, 2).toUpperCase());
          const shortCommit = computed(() => snippet.value?.commit?.slice(0, 12) || "");
          const snippetLanguage = computed(() => {
            const languages = { bash: "bash", node: "javascript", python: "python" };
            return languages[snippet.value?.type] || "plaintext";
          });
          const loginHref = `${registry}/auth/login?return_to=${encodeURIComponent(location.href)}`;

          onInit(async () => {
            if (!snippet.value && !listing.value) {
              error.value = "This snippet could not be found.";
            }
            try {
              const response = await fetch(`${registry}/auth/me`, {
                credentials: "include",
                headers: { Accept: "application/json" },
                signal: AbortSignal.timeout(4000),
              });
              if (response.ok) {
                user.value = await response.json();
              }
            } catch {
              // The public snippet view remains available when authentication is unreachable.
            } finally {
              authLoading.value = false;
            }
          });

          return {
            authLoading,
            error,
            listing,
            loginHref,
            shortCommit,
            snippet,
            snippetLanguage,
            snippets,
            user,
            userEmail,
            userInitials,
            userName,
            userPicture,
          };
        }
      </script>
    </template>
  </body>
</html>
